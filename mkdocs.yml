site_name: "immunum: antibody numbering and segmentation"
site_description: >-
  Fast antibody and T-cell receptor sequence numbering (IMGT, Kabat, Chothia, Martin, AHo) and
  FR/CDR segmentation for Python, Polars, Rust, JavaScript and the command line.
site_url: https://immunum.enpicom.com
repo_url: https://github.com/ENPICOM/immunum
repo_name: ENPICOM/immunum
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/immunum_logo.svg
  favicon: assets/immunum_logo.svg

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  locale: en
  features:
    - navigation.tracking
    - navigation.instant
    - navigation.expand
    - navigation.tabs
    - navigation.indexes
    - navigation.tabs.sticky
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.action.edit

nav:
  - Home:
      - index.md
      - Getting started: getting-started.md
      - Concepts and FAQ: concepts.md
      - Citation: citation.md
  - Demo: demo.md
  - Usage:
      - usage/index.md
      - Command line: usage/cli.md
      - Python: usage/python.md
      - Polars: usage/polars.md
      - JavaScript: usage/javascript.md
      - Rust: usage/rust.md
      - Errors: usage/errors.md
      - Upgrading to 2.0: usage/upgrading.md
      - Changelog: changelog.md
  - API:
      - api/index.md
      - immunum: api/immunum.md
      - immunum.polars: api/polars.md
      - JavaScript: api/javascript.md
      - Rust (docs.rs): https://docs.rs/immunum
  - Benchmarks: benchmarks/index.md
  - Contributing: contributing/index.md

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_version.py
  - scripts/mkdocs_pages.py

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            members_order: source
            show_source: true
            show_root_heading: true
            docstring_style: google
            show_if_no_docstring: false
            filters: ["!^_"]
            show_attribute_values: false
            merge_init_into_class: true
            docstring_options:
              returns_multiple_items: false

markdown_extensions:
  - pymdownx.snippets:
      base_path: [.]
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes

# wasm-pack writes these next to the bundle the demo loads; they aren't site pages or assets
exclude_docs: |
  assets/wasm/README.md
  assets/wasm/LICENSE
  assets/wasm/package.json
  assets/wasm/*.d.ts

validation:
  omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
