# resources/opig/sabdab2_paired_and_vhh_pdb_sequences.csv (chain_type heavy/light/VHH),
# light chains split into kappa/lambda by ANARCI's own chain-type call, numbered with
# legacy/original ANARCI (anarci_original).
# Unlike the fixtures above, these are NOT pre-trimmed to the variable domain -- most
# rows include the constant region appended directly after FR4, so a tool has to find
# the domain boundary itself. perfect_pct is well below the fixtures above because of
# that: immunum sometimes clips the alignment before finishing FR4 once a long
# constant-region tail follows (see docs/benchmarks/index.md). VHH (nano) is numbered as
# heavy (no paired light chain to distinguish it) and scores lowest of the four, likely
# because nanobody CDR3s are typically longer, making the same tail-clipping issue worse.
